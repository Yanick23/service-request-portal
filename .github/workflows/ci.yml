name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -b

      - name: Test
        run: npm run test

  deploy-staging:
    name: Deploy to staging
    needs: test
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://${{ github.repository_owner }}.github.io/service-request-portal/staging/
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check required environment variables
        run: |
          missing=()
          [ -z "$VITE_OIDC_AUTHORITY" ] && missing+=(VITE_OIDC_AUTHORITY)
          [ -z "$VITE_OIDC_CLIENT_ID" ] && missing+=(VITE_OIDC_CLIENT_ID)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required variable(s) in the 'staging' environment: ${missing[*]}. Set them under Settings > Environments > staging > Environment variables."
            exit 1
          fi
        env:
          VITE_OIDC_AUTHORITY: ${{ vars.VITE_OIDC_AUTHORITY }}
          VITE_OIDC_CLIENT_ID: ${{ vars.VITE_OIDC_CLIENT_ID }}

      - name: Build
        run: npx vite build --base=/service-request-portal/staging/
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_USE_MOCKS: ${{ vars.VITE_USE_MOCKS }}
          VITE_OIDC_AUTHORITY: ${{ vars.VITE_OIDC_AUTHORITY }}
          VITE_OIDC_CLIENT_ID: ${{ vars.VITE_OIDC_CLIENT_ID }}
          VITE_OIDC_SCOPE: ${{ vars.VITE_OIDC_SCOPE }}

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: staging
          keep_files: true

  deploy-production:
    name: Deploy to production
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ github.repository_owner }}.github.io/service-request-portal/
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check required environment variables
        run: |
          missing=()
          [ -z "$VITE_OIDC_AUTHORITY" ] && missing+=(VITE_OIDC_AUTHORITY)
          [ -z "$VITE_OIDC_CLIENT_ID" ] && missing+=(VITE_OIDC_CLIENT_ID)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required variable(s) in the 'production' environment: ${missing[*]}. Set them under Settings > Environments > production > Environment variables."
            exit 1
          fi
        env:
          VITE_OIDC_AUTHORITY: ${{ vars.VITE_OIDC_AUTHORITY }}
          VITE_OIDC_CLIENT_ID: ${{ vars.VITE_OIDC_CLIENT_ID }}

      - name: Build
        run: npx vite build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_USE_MOCKS: ${{ vars.VITE_USE_MOCKS }}
          VITE_OIDC_AUTHORITY: ${{ vars.VITE_OIDC_AUTHORITY }}
          VITE_OIDC_CLIENT_ID: ${{ vars.VITE_OIDC_CLIENT_ID }}
          VITE_OIDC_SCOPE: ${{ vars.VITE_OIDC_SCOPE }}

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: .
          keep_files: true
